<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Configs</title>
<style>
  :root {
    --bg: #f6f6f4;
    --fg: #16181c;
    --muted: #6b7078;
    --line: #dcdcd8;
    --btn-bg: #16181c;
    --btn-fg: #ffffff;
    --ok: #1f8a4c;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215;
      --fg: #eceef1;
      --muted: #8d939c;
      --line: #262a30;
      --btn-bg: #ffffff;
      --btn-fg: #101215;
      --ok: #4cc380;
      --err: #ff7a6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 20px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .src { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; word-break: break-all; }
  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    padding: 10px 12px;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
  }
  input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button.link { background: none; color: var(--muted); padding: 0; font-weight: 500; text-decoration: underline; }
  button.link:hover { color: var(--fg); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .who { margin-left: auto; color: var(--muted); font-size: 0.9rem; }
  #status, #authStatus { color: var(--muted); font-size: 0.95rem; }
  .ok { color: var(--ok) !important; }
  .err { color: var(--err) !important; }
  .spin {
    display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    border: 2px solid var(--muted); border-top-color: transparent;
    border-radius: 50%; vertical-align: -1px;
    animation: r 0.8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  li a { color: var(--fg); text-decoration: none; font-weight: 500; word-break: break-all; }
  li a:hover { text-decoration: underline; }
  .raw { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .raw:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Configs</h1>
  <p class="src">github.com/ewqerx/cloud/config</p>

  <section id="auth" hidden>
    <form id="form">
      <input id="name" type="text" placeholder="Username" autocomplete="username" maxlength="16" required>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" maxlength="64" required>
      <div class="row">
        <button id="login" type="submit">Log in</button>
        <button id="register" class="ghost" type="button">Register</button>
        <span id="authStatus" role="status" aria-live="polite"></span>
      </div>
    </form>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <button id="reload" type="button">Reload</button>
      <span id="status" role="status" aria-live="polite"></span>
      <span class="who"><span id="who"></span> &middot; <button id="logout" class="link" type="button">Log out</button></span>
    </div>
    <ul id="list"></ul>
  </section>
</main>

<script>
  const API = "https://api.github.com/repos/ewqerx/cloud/contents/config";
  const AUTH = "https://guichat.3mjjackson2.workers.dev";
  const KEY = "cloud_session";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const authStatus = $("authStatus");
  const listEl = $("list");
  const btn = $("reload");

  let session = readSession();

  function readSession() {
    try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
  }

  function writeSession(s) {
    try {
      if (s) localStorage.setItem(KEY, JSON.stringify(s));
      else localStorage.removeItem(KEY);
    } catch (e) {}
  }

  function say(el, html, cls) {
    el.className = cls || "";
    el.innerHTML = html;
  }

  function show() {
    $("auth").hidden = !!session;
    $("app").hidden = !session;
    if (session) {
      $("who").textContent = session.name;
      loadConfigs();
    }
  }

  async function submitAuth(action) {
    const name = $("name").value.trim();
    const pass = $("pass").value;
    if (!name || !pass) return;

    $("login").disabled = true;
    $("register").disabled = true;
    say(authStatus, '<span class="spin"></span>Working...');

    try {
      const res = await fetch(AUTH + "/" + action, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, pass })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ").");

      session = { name: data.name, token: data.token };
      writeSession(session);
      $("pass").value = "";
      say(authStatus, "");
      show();
    } catch (e) {
      say(authStatus, e.message || "Could not reach server.", "err");
    } finally {
      $("login").disabled = false;
      $("register").disabled = false;
    }
  }

  async function logout() {
    const token = session && session.token;
    session = null;
    writeSession(null);
    show();
    if (!token) return;
    try {
      await fetch(AUTH + "/logout", { method: "POST", headers: { Authorization: "Bearer " + token } });
    } catch (e) {}
  }

  async function checkSession() {
    if (!session) return;
    try {
      const res = await fetch(AUTH + "/me", { headers: { Authorization: "Bearer " + session.token } });
      if (res.status === 401) {
        session = null;
        writeSession(null);
      }
    } catch (e) {}
  }

  async function loadConfigs() {
    btn.disabled = true;
    listEl.innerHTML = "";
    say(statusEl, '<span class="spin"></span>Loading config...');

    try {
      const res = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
      if (res.status === 403 || res.status === 429) throw new Error("GitHub rate limit reached. Try again in a few minutes.");
      if (res.status === 404) throw new Error("Config folder not found. Check that the repo is public.");
      if (!res.ok) throw new Error("GitHub returned " + res.status + ".");

      const items = await res.json();
      const files = items.filter((f) => f.type === "file" && f.name.toLowerCase().endsWith(".json"));

      if (!files.length) {
        say(statusEl, "No .json configs found.", "err");
        return;
      }

      for (const f of files) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = f.html_url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = f.name;
        const raw = document.createElement("a");
        raw.className = "raw";
        raw.href = f.download_url;
        raw.target = "_blank";
        raw.rel = "noopener";
        raw.textContent = "raw";
        li.append(a, raw);
        listEl.appendChild(li);
      }
      say(statusEl, "Loaded " + files.length + " config" + (files.length === 1 ? "" : "s") + ".", "ok");
    } catch (e) {
      say(statusEl, e.message || "Could not load configs.", "err");
    } finally {
      btn.disabled = false;
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    submitAuth("login");
  });
  $("register").addEventListener("click", () => submitAuth("register"));
  $("logout").addEventListener("click", logout);
  btn.addEventListener("click", loadConfigs);

  checkSession().then(show);
</script>
</body>
</html>
