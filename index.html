<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Configs</title>
<style>
  :root {
    --bg: #f6f6f4;
    --fg: #16181c;
    --muted: #6b7078;
    --line: #dcdcd8;
    --btn-bg: #16181c;
    --btn-fg: #ffffff;
    --ok: #1f8a4c;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215;
      --fg: #eceef1;
      --muted: #8d939c;
      --line: #262a30;
      --btn-bg: #ffffff;
      --btn-fg: #101215;
      --ok: #4cc380;
      --err: #ff7a6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 48px 20px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .src { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; word-break: break-all; }
  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  button {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  #status { color: var(--muted); font-size: 0.95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .spin {
    display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    border: 2px solid var(--muted); border-top-color: transparent;
    border-radius: 50%; vertical-align: -1px;
    animation: r 0.8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  li a { color: var(--fg); text-decoration: none; font-weight: 500; word-break: break-all; }
  li a:hover { text-decoration: underline; }
  .raw { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .raw:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Configs</h1>
  <p class="src">github.com/ewqerx/cloud/config</p>

  <div class="bar">
    <button id="reload" type="button">Reload</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <ul id="list"></ul>
</main>

<script>
  const API = "https://api.github.com/repos/ewqerx/cloud/contents/config";
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  const btn = document.getElementById("reload");

  function setStatus(html, cls) {
    statusEl.className = cls || "";
    statusEl.innerHTML = html;
  }

  async function loadConfigs() {
    btn.disabled = true;
    listEl.innerHTML = "";
    setStatus('<span class="spin"></span>Loading config...');

    try {
      const res = await fetch(API, { headers: { Accept: "application/vnd.github+json" } });
      if (res.status === 403 || res.status === 429) throw new Error("GitHub rate limit reached. Try again in a few minutes.");
      if (res.status === 404) throw new Error("Config folder not found. Check that the repo is public.");
      if (!res.ok) throw new Error("GitHub returned " + res.status + ".");

      const items = await res.json();
      const files = items.filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".json"));

      if (!files.length) {
        setStatus("No .json configs found.", "err");
        return;
      }

      for (const f of files) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = f.html_url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = f.name;
        const raw = document.createElement("a");
        raw.className = "raw";
        raw.href = f.download_url;
        raw.target = "_blank";
        raw.rel = "noopener";
        raw.textContent = "raw";
        li.append(a, raw);
        listEl.appendChild(li);
      }
      setStatus("Loaded " + files.length + " config" + (files.length === 1 ? "" : "s") + ".", "ok");
    } catch (e) {
      setStatus(e.message || "Could not load configs.", "err");
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", loadConfigs);
  loadConfigs();
</script>
</body>
</html>
