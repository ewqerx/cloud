<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Remporia</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #14161a;
  --bg-2: #1c1f24;
  --text: #fcfcfc;
  --text-dim: rgba(252, 252, 252, 0.8);
  --border: rgba(255, 255, 255, 0.55);
  --border-strong: #fcfcfc;
  --star: 255, 255, 255;
  --dropdown-bg: rgba(28, 30, 36, 0.85);
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  font-family: "Noto Sans", sans-serif;
  overflow-x: hidden;
}

#stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

#clock {
  position: fixed;
  top: 16px;
  left: 16px;
  color: var(--text);
  font-family: "Noto Sans", sans-serif;
  font-size: 16px;
  z-index: 10;
}

#discord {
  position: fixed;
  bottom: 16px;
  left: 16px;
  color: var(--text);
  font-family: "Noto Sans", sans-serif;
  font-size: 16px;
  text-decoration: none;
  opacity: 0.8;
  z-index: 5;
}

#discord:hover {
  opacity: 1;
}

#typer {
  color: var(--text);
  font-size: 28px;
  letter-spacing: 0.5px;
}

#cursor {
  display: inline-block;
  width: 3px;
  background: var(--text);
  margin-left: 4px;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  50.01%, 100% { opacity: 0; }
}

#accountWrap {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 10;
}

#loginLink {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  font-family: "Noto Sans", sans-serif;
  font-size: 20px;
  font-weight: 700;
  text-decoration: none;
  padding: 16px 34px;
  border: 2px solid var(--border-strong);
  border-radius: 8px;
  opacity: 1;
}

#loginLink:hover {
  background: rgba(128, 128, 128, 0.12);
}

#avatarBtn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: pointer;
  border: 1px solid var(--border);
  display: none;
}

#dropdown {
  display: none;
  position: absolute;
  right: 0;
  top: 58px;
  background: var(--dropdown-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  min-width: 180px;
  text-align: left;
  z-index: 20;
}

#dropdown .name {
  padding: 4px 6px;
  font-size: 14px;
  color: var(--text);
  opacity: 0.8;
}

#renameInput {
  width: 100%;
  box-sizing: border-box;
  margin-top: 6px;
  padding: 6px;
  border-radius: 4px;
  border: 1px solid var(--text);
  background: transparent;
  color: var(--text);
  font-family: "Noto Sans", sans-serif;
}

#renameBtn, #dropdown a {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-top: 6px;
  padding: 6px;
  border-radius: 4px;
  border: 1px solid var(--text);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  font-family: "Noto Sans", sans-serif;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="clock"></div>

<div id="accountWrap">
  <a id="loginLink" href="#">Log in</a>
  <img id="avatarBtn" src="">
  <div id="dropdown">
    <div class="name" id="shownName"></div>
    <input id="renameInput" type="text" placeholder="new display name">
    <button id="renameBtn">Save name</button>
    <a id="logoutLink" href="#">Log out</a>
  </div>
</div>

<a id="discord" href="https://discord.gg/CYtBpMyuyv">discord</a>

<div><span id="typer"></span><span id="cursor">&nbsp;</span></div>

<script>
var WORKER_ORIGIN = "https://little-bonus-c967.3mjjackson2.workers.dev";

function pad(n) {
  return n < 10 ? "0" + n : n;
}

function updateClock() {
  var now = new Date();
  document.getElementById("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
}

updateClock();
setInterval(updateClock, 1000);

var words = ["hello...", "remporia is the best", "bestest of the flagless no flag"];
var wordIndex = 0;
var charIndex = 0;
var deleting = false;
var typer = document.getElementById("typer");

function loop() {
  var current = words[wordIndex];

  if (!deleting) {
    charIndex++;
    typer.textContent = current.substring(0, charIndex);

    if (charIndex === current.length) {
      deleting = true;
      setTimeout(loop, 1800);
      return;
    }
  } else {
    charIndex--;
    typer.textContent = current.substring(0, charIndex);

    if (charIndex === 0) {
      deleting = false;
      wordIndex = (wordIndex + 1) % words.length;
      setTimeout(loop, 600);
      return;
    }
  }

  setTimeout(loop, deleting ? 90 : 140);
}

loop();

var loginLink = document.getElementById("loginLink");
var avatarBtn = document.getElementById("avatarBtn");
var dropdown = document.getElementById("dropdown");
var shownName = document.getElementById("shownName");
var renameInput = document.getElementById("renameInput");
var logoutLink = document.getElementById("logoutLink");

loginLink.href = WORKER_ORIGIN + "/discord/login?return=" + encodeURIComponent(location.href);

async function loadAccount() {
  try {
    var res = await fetch(WORKER_ORIGIN + "/api/me", { credentials: "include" });
    var data = await res.json();

    if (data.loggedIn) {
      loginLink.style.display = "none";
      avatarBtn.style.display = "block";
      avatarBtn.src = data.avatarUrl;
      shownName.textContent = data.name;
      renameInput.value = data.name;
      logoutLink.href = WORKER_ORIGIN + "/discord/logout?return=" + encodeURIComponent(location.href);
    }
  } catch (e) {}
}

loadAccount();

avatarBtn.addEventListener("click", function() {
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
});

document.addEventListener("click", function(e) {
  if (!dropdown.contains(e.target) && e.target !== avatarBtn) {
    dropdown.style.display = "none";
  }
});

renameInput.parentElement.querySelector("#renameBtn").addEventListener("click", async function() {
  var val = renameInput.value.trim();
  if (!val) return;
  await fetch(WORKER_ORIGIN + "/api/rename", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: val })
  });
  shownName.textContent = val;
});

var canvas = document.getElementById("stars");
var ctx = canvas.getContext("2d");
var starCount = 220;
var stars = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function makeStars() {
  stars = [];
  for (var i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.3,
      baseAlpha: Math.random() * 0.6 + 0.3,
      speed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var twinkle = Math.sin(t * s.speed + s.phase) * 0.35 + 0.65;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255," + (s.baseAlpha * twinkle) + ")";
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}

resizeCanvas();
makeStars();
requestAnimationFrame(drawStars);

window.addEventListener("resize", function() {
  resizeCanvas();
  makeStars();
});
</script>

</body>
</html>
